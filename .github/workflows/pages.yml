# Geçici önizleme: main'e her push'ta siteyi derleyip GitHub Pages'e yayınlar.
# Adres: https://ismailhasir.github.io/horpol-trailer-systems/ (arama motorlarına kapalı: PUBLIC_PREVIEW)
# Bir kez açmak için: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Pages önizleme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://ismailhasir.github.io
          BASE_PATH: /horpol-trailer-systems
          PUBLIC_PREVIEW: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
